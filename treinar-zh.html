<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinar Chinês (Hanzi) - Tradutor de Frases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .flashcard {
            min-height: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2.5rem 1.5rem;
            border-radius: 1.25rem;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease;
            user-select: none;
        }
        .flashcard:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(0,0,0,.12); }
        .flashcard .hanzi-text { font-size: 4.5rem; font-weight: 700; color: #dc3545; line-height: 1.2; }
        .flashcard .pinyin-text { font-size: 1.5rem; color: #0d6efd; margin-top: .5rem; }
        .flashcard .meaning-text { font-size: 1.8rem; font-weight: 600; color: #198754; line-height: 1.3; }
        .flashcard .trad-text { font-size: 1.2rem; color: #6c757d; margin-top: .5rem; }
        .flashcard .divider { width: 80px; border-top: 2px solid #e9ecef; margin: 1.25rem 0; }
        .flashcard .hint { color: #adb5bd; font-size: .9rem; margin-top: 1rem; }
        .flashcard .badge-flag { font-size: .8rem; letter-spacing: .5px; }
        .kbd { display: inline-block; padding: .1rem .4rem; border: 1px solid #ccc; border-bottom-width: 2px;
               border-radius: .3rem; background: #fff; font-size: .75rem; font-family: monospace; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 860px;">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h3 class="mb-0">🀄 Treinar Chinês (Hanzi)</h3>
        <div class="d-flex gap-2">
            <a href="treinar.html" class="btn btn-outline-info btn-sm">
                <i class="bi bi-mortarboard"></i> Treinar inglês
            </a>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-house"></i> Página inicial
            </a>
        </div>
    </div>

    <!-- Filtro HSK -->
    <div class="card mb-3">
        <div class="card-body py-2">
            <div class="row g-2 align-items-center">
                <div class="col-md-6">
                    <label for="hskFilter" class="form-label mb-0 small fw-bold">Nível HSK</label>
                    <select id="hskFilter" class="form-select form-select-sm">
                        <option value="all">Todos os níveis</option>
                        <option value="HSK 1">HSK 1</option>
                        <option value="HSK 2">HSK 2</option>
                        <option value="HSK 3">HSK 3</option>
                        <option value="HSK 4">HSK 4</option>
                        <option value="HSK 5">HSK 5</option>
                        <option value="HSK 6">HSK 6</option>
                        <option value="HSK 7+">HSK 7–9</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <div class="d-flex justify-content-between align-items-center mb-1 small text-muted">
                        <span>Card <strong id="cardIndex">0</strong> de <strong id="cardTotal">0</strong></span>
                        <span id="deckInfo">—</span>
                    </div>
                    <div class="progress" style="height: 10px;">
                        <div id="trainProgress" class="progress-bar bg-danger" role="progressbar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- O flashcard -->
    <div id="flashcard" class="flashcard mb-3">
        <span class="badge badge-flag bg-danger mb-3" id="frontBadge">🀄 HANZI</span>
        <div id="cardText" class="hanzi-text">Carregando…</div>
        <div id="cardPinyin" class="pinyin-text"></div>
        <div id="cardBack" class="w-100" style="display:none;">
            <div class="divider mx-auto"></div>
            <span class="badge badge-flag bg-success mb-3">SIGNIFICADO</span>
            <div id="cardTranslation" class="meaning-text"></div>
            <div id="cardTrad" class="trad-text"></div>
        </div>
        <div class="hint" id="cardHint">Clique no card para ver o significado</div>
    </div>

    <!-- Ações principais -->
    <div class="d-flex gap-2 mb-3 flex-wrap">
        <button id="playZhBtn" class="btn btn-outline-danger flex-fill">
            <i class="bi bi-volume-up-fill"></i> Ouvir chinês
        </button>
        <button id="flipBtn" class="btn btn-danger flex-fill">
            <i class="bi bi-arrow-repeat"></i> Mostrar significado
        </button>
    </div>

    <!-- Navegação -->
    <div class="d-flex gap-2 mb-4 flex-wrap">
        <button id="prevBtn" class="btn btn-outline-secondary flex-fill">
            <i class="bi bi-arrow-left"></i> Anterior
        </button>
        <button id="shuffleBtn" class="btn btn-outline-secondary flex-fill">
            <i class="bi bi-shuffle"></i> Embaralhar
        </button>
        <button id="nextBtn" class="btn btn-outline-secondary flex-fill">
            Próxima <i class="bi bi-arrow-right"></i>
        </button>
    </div>

    <!-- Opções -->
    <div class="card">
        <div class="card-body">
            <div class="row g-3 align-items-center">
                <div class="col-md-5">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="autoPlay" checked>
                        <label class="form-check-label" for="autoPlay">Reproduzir áudio automaticamente</label>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label mb-0 small fw-bold">Velocidade</label>
                    <input type="range" class="form-range" id="speechRate" min="0.5" max="1.5" step="0.1" value="0.95">
                </div>
                <div class="col-md-3">
                    <label class="form-label mb-0 small fw-bold">Volume</label>
                    <input type="range" class="form-range" id="speechVolume" min="0" max="1" step="0.1" value="1">
                </div>
            </div>
            <hr class="my-3">
            <div class="small text-muted">
                Atalhos: <span class="kbd">Espaço</span> virar ·
                <span class="kbd">←</span>/<span class="kbd">→</span> navegar ·
                <span class="kbd">1</span> ouvir chinês
            </div>
        </div>
    </div>

    <p class="text-center text-muted small mt-3 mb-0">
        Hanzi consumidos do deck Anki-xiehanzi (HSK 2025) · Áudio nativo mandarim.
    </p>
</div>

<script src="js/treinar-zh.js"></script>
</body>
</html>
