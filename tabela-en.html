<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Inglês → Português - Tradutor de Frases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .en-cell { font-weight: 600; color: #0d6efd; }
        .pt-cell { font-weight: 600; color: #198754; }
        .table thead th { position: sticky; top: 0; background: #f8f9fa; z-index: 1; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 1080px;">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h3 class="mb-0">📋 Tabela Inglês → Português</h3>
        <div class="d-flex gap-2">
            <a href="treinar.html" class="btn btn-outline-info btn-sm">
                <i class="bi bi-mortarboard"></i> Treinar inglês
            </a>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-house"></i> Página inicial
            </a>
        </div>
    </div>

    <!-- Filtros -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-9">
                    <label for="searchBox" class="form-label fw-bold small mb-1">Buscar (inglês ou português)</label>
                    <input id="searchBox" type="search" class="form-control form-control-sm" placeholder="Ex.: car  carro">
                </div>
                <div class="col-md-3 text-md-end">
                    <span class="badge bg-secondary" id="rowCount">0 itens</span>
                </div>
            </div>
            <div class="d-flex gap-2 mt-2 flex-wrap">
                <a id="expEnXlsx" class="btn btn-success btn-sm" href="downloads/frases_en_pt.xlsx" download>
                    <i class="bi bi-file-earmark-spreadsheet"></i> Exportar XLSX
                </a>
                <a id="expEnTxt" class="btn btn-info btn-sm" href="downloads/frases_en_pt.txt" download>
                    <i class="bi bi-file-earmark-text"></i> Exportar TXT
                </a>
            </div>
        </div>
    </div>

    <!-- Tabela -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive" style="max-height: 62vh; overflow-y: auto;">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead>
                        <tr>
                            <th style="width: 60px;">#</th>
                            <th>Inglês</th>
                            <th>Português</th>
                            <th style="width: 80px;">EN</th>
                            <th style="width: 80px;">PT</th>
                        </tr>
                    </thead>
                    <tbody id="enRows">
                        <tr><td colspan="5" class="text-center text-muted py-4">Carregando…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-light">
            <div class="d-flex justify-content-center align-items-center gap-2 flex-wrap">
                <button id="prevPage" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> Anterior
                </button>
                <span class="small text-muted">Página <strong id="curPage">1</strong> de <strong id="totPages">1</strong></span>
                <button id="nextPage" class="btn btn-outline-secondary btn-sm">
                    Próxima <i class="bi bi-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <p class="text-center text-muted small mt-3 mb-0">
        1.982 frases traduzidas · Clique em EN/PT para ouvir (onde houver áudio).
    </p>
</div>

<script src="js/tabela-en.js"></script>
</body>
</html>
